<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="boxInput">
            <input type="text" value="0" readonly class="inputStyle" id="displayInput">
        </div>
        <div class="boxButtons">
            <button class="btnStyle">(</button>
            <button class="btnStyle">)</button>
            <button class="btnStyle">%</button>

            <button class="btnStyle acBtnStyle" id="acBtn">AC</button>

            <button class="btnStyle numBtn">7</button>
            <button class="btnStyle numBtn">8</button>
            <button class="btnStyle numBtn">9</button>

            <button class="btnStyle actionBtn">/</button>

            <button class="btnStyle numBtn">4</button>
            <button class="btnStyle numBtn">5</button>
            <button class="btnStyle numBtn">6</button>

            <button class="btnStyle actionBtn">*</button>
            
            <button class="btnStyle numBtn">1</button>
            <button class="btnStyle numBtn">2</button>
            <button class="btnStyle numBtn">3</button>
            
            <button class="btnStyle actionBtn">-</button>
            
            <button class="btnStyle numBtn">0</button>
            
            <button class="btnStyle">.</button>
            
            <button class="btnStyle" id="equalsBtn">=</button>
            
            <button class="btnStyle actionBtn">+</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
